<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #e0e0e0; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 280px; background: #1a1a2e; padding: 16px; display: flex; flex-direction: column; border-left: 1px solid #2a2a4a; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 16px; background: #1a1a2e; border-bottom: 1px solid #2a2a4a; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-area { padding: 16px; background: #1a1a2e; border-top: 1px solid #2a2a4a; }
    .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.6; }
    .message.user { background: #4c6ef5; align-self: flex-end; }
    .message.agent { background: #2a2a4a; align-self: flex-start; }
    .message.system { background: transparent; align-self: center; font-size: 0.9em; color: #888; }
    .message .agent-name { font-size: 0.8em; color: #91a7ff; margin-bottom: 4px; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #2a2a4a; background: #0f0f1a; color: #e0e0e0; font-size: 1em; }
    .input-row input:focus { outline: none; border-color: #4c6ef5; }
    .input-row button { padding: 12px 24px; border-radius: 8px; border: none; background: #4c6ef5; color: white; cursor: pointer; font-size: 1em; }
    .input-row button:hover { background: #3b5bdb; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .suggestions button { padding: 6px 12px; border-radius: 16px; border: 1px solid #4c6ef5; background: transparent; color: #91a7ff; cursor: pointer; font-size: 0.85em; }
    .suggestions button:hover { background: #4c6ef5; color: white; }
    .code-block { background: #0f0f1a; border-radius: 8px; padding: 12px; margin: 8px 0; font-family: monospace; font-size: 0.85em; overflow-x: auto; white-space: pre-wrap; direction: ltr; text-align: left; }
    .agent-status { padding: 8px; margin: 4px 0; border-radius: 6px; font-size: 0.85em; background: #1a1a2e; }
    .agent-status.working { border-right: 3px solid #fcc419; }
    .agent-status.done { border-right: 3px solid #51cf66; }
    .agent-status.error { border-right: 3px solid #ff6b6b; }
    .sidebar h2 { font-size: 1em; color: #91a7ff; margin-bottom: 12px; }
    .sidebar .agent-list { flex: 1; overflow-y: auto; }
    .sidebar .agent-item { padding: 8px; margin: 4px 0; border-radius: 6px; background: #0f0f1a; cursor: pointer; font-size: 0.85em; }
    .sidebar .agent-item:hover { background: #2a2a4a; }
    .attachments { margin-top: 8px; }
    .attachment-tab { display: inline-block; padding: 4px 10px; border-radius: 4px; background: #0f0f1a; margin: 2px; font-size: 0.8em; cursor: pointer; color: #91a7ff; border: 1px solid #2a2a4a; }
    .attachment-tab:hover { background: #2a2a4a; }
    .typing { display: flex; gap: 4px; padding: 12px; align-self: flex-start; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: #4c6ef5; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
