[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-studio"
version = "0.3.0"
description = "Chat-centric animation studio — multi-agent chat with Remotion code output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0,<3.0.0",
  "typing_extensions>=4.12.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "Pillow>=10.0.0,<12.0.0",
  "openai>=1.40.0,<2.0.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint>=2.0.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "chromadb>=0.5.0",
  "diskcache>=5.6",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "easing-functions>=1.0.0",
  "typer>=0.9.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.24.0",
  "websockets>=12.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.9.0",
]
llm = [
  "hazm>=0.10.0",
  "sentence-transformers>=3.0.0",
]

[project.scripts]
story-studio = "story_cli:main"

[tool.setuptools]
py-modules = ["scene_ir", "studio_spec", "story_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "libraries*", "prompts*", "llm*", "chat*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
