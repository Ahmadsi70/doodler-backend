[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-studio"
version = "0.2.0"
description = "Standalone Story / Narrative 2D (Remotion local + Williams timing)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0,<3.0.0",
  "typing_extensions>=4.12.0",
  "streamlit>=1.32.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "Pillow>=10.0.0,<12.0.0",
  "openai>=1.40.0,<2.0.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
story-studio = "story_cli:main"

[tool.setuptools]
py-modules = ["scene_ir", "studio_spec", "app", "story_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "runtime*", "libraries*", "prompts*", "llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
