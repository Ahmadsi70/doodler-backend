name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0.0"

      - name: Unit tests
        env:
          ANIMATION_DETERMINISTIC_SLIDES: "1"
          STORY_USE_LLM: "0"
          QUALITY_GATE_STRICT: "0"
        run: python -m pytest tests -q --tb=short

      - name: Smoke export bundle
        env:
          ANIMATION_DETERMINISTIC_SLIDES: "1"
          STORY_USE_LLM: "0"
          QUALITY_GATE_STRICT: "0"
        run: python scripts/smoke_render.py

      - name: Golden Pro props contract
        env:
          STORY_USE_LLM: "0"
        run: python -m pytest tests/test_story_pro_golden.py -q --tb=short
